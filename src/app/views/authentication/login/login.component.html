<c-container>
  <c-row class="justify-content-center">
    <c-col lg="6" md="8" xl="5">
      <div class="d-flex flex-column gap-4">
        <div class="text-center">
          <svg [class]="{ icon: false }" cIcon height="48" name="logo" title="Jehovah Jireh ERP"></svg>
        </div>
        <c-card class="p-4">
          <c-card-body class="d-flex flex-column gap-4">
            <h2 class="h5 text-center mb-0">Inicia sesión en tu cuenta</h2>
            <form cForm cRow class="gy-3" [formGroup]="form" (ngSubmit)="submit()">
              <c-col xs="12">
                <label cLabel for="username">Usuario</label>
                <input
                  autocomplete="username"
                  cFormControl
                  id="username"
                  formControlName="username"
                  placeholder="Nombre de usuario"
                  type="text"
                />
              </c-col>
              <c-col xs="12">
                <label cLabel for="password">Contraseña</label>
                <input
                  autocomplete="current-password"
                  cFormControl
                  id="password"
                  formControlName="password"
                  placeholder="Tu contraseña"
                  type="password"
                />
              </c-col>
              @if (errorMessage()) {
                <c-col xs="12">
                  <div class="alert alert-danger mb-0" role="alert">{{ errorMessage() }}</div>
                </c-col>
              }
              <c-col xs="12">
                <button
                  cButton
                  class="w-100"
                  color="primary"
                  type="submit"
                  [disabled]="form.invalid || submitting()"
                >
                  {{ submitting() ? 'Ingresando...' : 'Iniciar sesión' }}
                </button>
              </c-col>
            </form>
          </c-card-body>
        </c-card>
      </div>
    </c-col>
  </c-row>
</c-container>
