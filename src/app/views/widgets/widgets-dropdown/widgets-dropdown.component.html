<c-row class="g-4">
  @for (metric of metrics(); track metric.title) {
    <c-col sm="6" xl="3">
      <c-widget-stat-a [color]="metric.color" [title]="metric.title">
        <ng-template cTemplateId="widgetValueTemplate" ngPreserveWhitespaces>
          {{ metric.value }}
        </ng-template>
        <ng-template cTemplateId="widgetChartTemplate">
          <c-chart
            [data]="metricChart(metric)"
            [options]="options[0]"
            class="mt-3 mx-3"
            height="70"
            type="line"
          />
        </ng-template>
      </c-widget-stat-a>
    </c-col>
  }
</c-row>
